meters:
- name: proctored_exam_attempts
  description: Number of proctored exam attempts launched; the primary billing unit.
  unit: exams
  aggregation: sum
  dimensions:
  - institution
  - course
  - term
- name: student_paid_exams
  description: Exams paid directly by students via credit card (institution incurs no cost).
  unit: exams
  aggregation: sum
  dimensions:
  - student
  - term
principles:
- name: Visibility
  description: Track proctored exam attempts per course, term, and department; distinguish institution-invoiced from student-paid attempts.
- name: Allocation
  description: Map exam attempts to courses/departments so proctoring cost lands on the owning program.
- name: Optimization
  description: Reserve proctoring for high-stakes exams, use lighter exam-settings profiles where full recording is not required, and consider student-pay to shift cost off the institution.
- name: Accountability
  description: Assign an owner per program; review attempt volume against the contracted rate and budget each term.
