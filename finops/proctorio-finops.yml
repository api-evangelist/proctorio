description: >-
  FinOps view of Proctorio spend. Proctorio is not billed as a metered API;
  cost is driven by proctored exam attempts under an institution or partner
  agreement, invoiced to the institution or paid directly by students. The v2
  integration API and result webhooks are included with the agreement rather
  than priced as a separate API line item, so there is no per-call API cost to
  allocate - the meaningful cost unit is the proctored exam attempt (and, in
  student-pay arrangements, the cost shifts entirely to the student).
notes: >-
  Per-attempt rates are negotiated and not officially published; verify with
  Proctorio. Cost allocation is naturally per course / exam / term because that
  is how exam attempts are counted.
