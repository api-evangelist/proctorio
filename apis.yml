name: Proctorio
kind: company
description: Proctorio is a remote proctoring and learning-integrity platform that
  secures online exams with automated recording (video, audio, screen, web traffic),
  identity verification, lockdown-browser behavior controls, and post-exam suspicion
  scoring with behavioral flags. Proctorio is delivered primarily as an LMS-embedded
  integration - LTI 1.1 and LTI 1.3 for Canvas, Blackboard, Brightspace (D2L), Moodle,
  and ILIAS - so most institutions never touch a REST API directly. For assessment
  platforms that are not LMS-native, Proctorio also exposes a partner/integration
  REST API (v2) that generates signed exam launch URLs for candidates, reviewers,
  and live proctors, plus HMAC-signed result webhooks (v2/v3) that deliver the exam
  suspicion score and behavioral flags back to the integrating platform. API access
  is gated - the consumer key, secret key, and region-specific API endpoint are
  provisioned by a Proctorio representative per institution or partner - but the
  endpoint paths, request bodies, and webhook payloads are documented publicly in
  Proctorio's official Apache-2.0 .NET client (github.com/proctorio/API).
