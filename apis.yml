  description: >-
    After an exam attempt is submitted, Proctorio POSTs an HMAC-signed JSON webhook to the integrating
    platform's endpoint carrying the attempt id, user id, an overall suspicion score, submission metadata,
    and a set of behavioral flags (unfocus, clipboard, browser resize, multiple faces, leaving the exam
    area, speaking, AI-assistance, printing, screenshot, hardware change, external action, webcam obscured,
    mobile phone, and more, each weighted 0-1). Two payload versions are documented (v2 and v3). This
    is server-to-endpoint HTTP delivery over HTTPS, not a WebSocket; the payload can be re-emitted from
    the Review Center Export Options tab when behavior settings change. Payload shape is taken from Proctorio's
    official .NET client (Webhooks/Requests/V2 and V3).
